name: Deploy

# Builds the web app on Linux arm64 (same as the server) and releases it to the dev stage.
# AWS access uses GitHub OIDC and the lwk-dev-github-deploy role: no AWS keys are stored here.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  STAGE: dev
  DEPLOY_ROLE_ARN: arn:aws:iam::455280338092:role/lwk-dev-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package release
        run: bash deploy/build-bundle.sh "web-$GITHUB_SHA.tgz"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the web server and artifacts bucket
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "lwk-$STAGE-app" \
            --query 'Stacks[0].Outputs' --output json)
          echo "INSTANCE_ID=$(jq -r '.[] | select(.OutputKey=="InstanceId") | .OutputValue' <<<"$outputs")" >>"$GITHUB_ENV"
          echo "ARTIFACTS_BUCKET=$(jq -r '.[] | select(.OutputKey=="ArtifactsBucketName") | .OutputValue' <<<"$outputs")" >>"$GITHUB_ENV"
          echo "APP_URL=$(jq -r '.[] | select(.OutputKey=="AppUrl") | .OutputValue' <<<"$outputs")" >>"$GITHUB_ENV"

      - name: Upload release bundle
        run: aws s3 cp "web-$GITHUB_SHA.tgz" "s3://$ARTIFACTS_BUCKET/web/$GITHUB_SHA.tgz" --only-show-errors

      - name: Activate on the web server
        run: |
          prisma_version=$(node -p "require('./apps/web/package.json').devDependencies.prisma")
          release="/opt/lwk/releases/$GITHUB_SHA"
          commands=$(jq -cn --arg rel "$release" --arg src "s3://$ARTIFACTS_BUCKET/web/$GITHUB_SHA.tgz" \
            --arg stage "$STAGE" --arg prisma "$prisma_version" --arg region "$AWS_REGION" '[
              "set -euo pipefail",
              "rm -rf \($rel) && mkdir -p \($rel)",
              "aws s3 cp \($src) /tmp/release.tgz --region \($region) --only-show-errors",
              "tar -xzf /tmp/release.tgz -C \($rel) && rm -f /tmp/release.tgz",
              "\($rel)/activate.sh \($stage) \($prisma)"
            ]')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "{\"commands\":$commands,\"executionTimeout\":[\"1200\"]}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command $command_id"
          while true; do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "Status: $status"
            case "$status" in Pending | InProgress | Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = Success

      - name: Check the live site
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "$APP_URL/api/v1/health"; then exit 0; fi
            sleep 6
          done
          echo "Health check through CloudFront failed" && exit 1
